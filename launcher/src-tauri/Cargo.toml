[package]
name = "prism-launcher"
version = "0.1.0"
description = "Prism's launcher window"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[features]
# Serve the bundled UI instead of the dev server; `tauri build` turns it on.
custom-protocol = ["tauri/custom-protocol"]
